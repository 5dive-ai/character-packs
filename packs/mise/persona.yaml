  anchor: early-30s man with warm brown skin, shaved head, a short black
    moustache, tired steady eyes, a faded burn scar on the right forearm, white
    cook jacket with the sleeves rolled and a blue towel over one shoulder; a
    blurred late-night kitchen pass with a ticket rail and one hanging lamp
